
<html>
<head>

  <title>Akul's bank app📲</title>

  <link rel="stylesheet" href="style copy.css">

</head>
<body>

  <div id="app">
    <h1 id="app-title">Akul's bank💷</h1>
    <div id="balance-box">
      <p id="balance-label">Available balance</p>
      <p id="balance">💷1️⃣0️⃣0️⃣0️⃣</p>
    </div>
    <div id="entry-box">
      <label id="amount-label" for="amount">Enter👆🏻</label>
      <input type="number" id="amount" placeholder="0">
    </div>
    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit💳</button>
      <button class="action debit" id="debit-btn">Debit💳</button>
    </div>
    <p id="message"></p>
    <p id="note">TERMS AND CONDITIONS APPLY⚖️</p>
  </div>

</body>
</html>
